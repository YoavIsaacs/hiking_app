name: CI

# Pull requests run only the jobs whose area changed (the `changes` job); pushes to
# main and callers such as nightly.yml run everything. A job skipped by its job-level
# `if:` is reported as "skipped", which GitHub counts as passing for required checks.
# If `changes` itself fails, the gated jobs run rather than skip, so a broken filter can never hide a test.
# Job names are required-check contracts: lint, api-test, web-test, e2e, api-contract, benchmark, api-image.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      fresh-deps:
        description: "Resolve the newest allowed dependency versions (uv lock --upgrade, pnpm update) before testing; nothing is committed"
        type: boolean
        default: false

permissions:
  contents: read

# Runners are pinned to ubuntu-24.04, not ubuntu-latest: latest moved to 26.04 on 2026-11-01 and
# Playwright 1.64's WebKit build needs 24.04's libicu74 (main red, run 41313710211). Bump on purpose,
# together with the Playwright cache key (playwright-ubuntu-24.04-*), never by surprise.
# Never fall back to the runner's system python3.12 (3.12.3 on ubuntu-24.04: no expat allocation
# tracker, ADR 0004 section 3.11). only-managed makes uv ignore every non-uv interpreter, and
# setup-uv's python-version pins the exact patch, so a missing download fails instead of falling back.
env:
  UV_PYTHON_PREFERENCE: only-managed
  PINNED_PYTHON: "3.12.15" # must equal api/.python-version; the Interpreter steps fail if it drifts

# Only PR runs share a group (and are cancelled by a newer push). Every other run gets its own
# group (the SHA), because GitHub also cancels *pending* runs of a shared group even with
# cancel-in-progress false; so main, nightly and manual runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04 # pinned, not ubuntu-latest (see ci.yml header)
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's files through the API (no checkout needed)
    outputs:
      api: ${{ steps.out.outputs.api }}
      web: ${{ steps.out.outputs.web }}
      contract: ${{ steps.out.outputs.contract }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            api:
              - 'api/**'
            web:
              - 'web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            contract:
              - 'api/**'
              - 'web/src/api/**'
              - 'web/package.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            ci:
              - '.github/workflows/**'
              - '.github/scripts/**'
              - 'justfile'
              - '.pre-commit-config.yaml'
      # Anything that is not a PR (push to main, nightly, manual) runs everything;
      # a change to CI itself on a PR also runs everything.
      - name: Decide which jobs run
        id: out
        env:
          EVENT: ${{ github.event_name }}
          API: ${{ steps.filter.outputs.api }}
          WEB: ${{ steps.filter.outputs.web }}
          CONTRACT: ${{ steps.filter.outputs.contract }}
          CI_CHANGED: ${{ steps.filter.outputs.ci }}
        run: |
          all=false
          if [ "$EVENT" != "pull_request" ] || [ "$CI_CHANGED" = "true" ]; then all=true; fi
          decide() { if [ "$all" = "true" ] || [ "$1" = "true" ]; then echo true; else echo false; fi; }
          {
            echo "api=$(decide "$API")"
            echo "web=$(decide "$WEB")"
            echo "contract=$(decide "$CONTRACT")"
          } | tee -a "$GITHUB_OUTPUT"

  # lint stays unconditional: pre-commit --all-files is cheap, and it carries the
  # repo-wide hygiene hooks (check-yaml, private keys, whitespace) that any file can break.
  lint:
    name: lint
    timeout-minutes: 10
    runs-on: ubuntu-24.04 # pinned, not ubuntu-latest (see ci.yml header)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ env.PINNED_PYTHON }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Resolve fresh dependencies
        if: inputs.fresh-deps
        run: |
          uv lock --upgrade --directory api
          pnpm update --recursive
      - name: Install dependencies
        run: |
          uv sync --frozen --directory api
          pnpm install --frozen-lockfile
      - name: pre-commit
        run: uvx pre-commit@4.7.0 run --all-files --show-diff-on-failure
      # /health reports api/pyproject.toml's version; release-please bumps it with the manifest (extra-files).
      # Also runs on fresh-deps: `uv lock --upgrade` keeps the project's own version, so the check still passes.
      # release-please-config.json (JSON, no comments) points at the uv.lock entry with
      # `$.package[?(@.source.virtual)]`: release-please's jsonpath does not match a `@.name==` filter
      # (tested: "No entries modified"). The catch: a second virtual project in uv.lock would be bumped too.
      - name: Version sync (manifest, pyproject, uv.lock)
        run: bash .github/scripts/check-version-sync.sh

  api-test:
    name: api-test
    timeout-minutes: 15
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.api == 'true') }}
    runs-on: ubuntu-24.04 # pinned, not ubuntu-latest (see ci.yml header)
    permissions:
      contents: read
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ env.PINNED_PYTHON }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Resolve fresh dependencies
        if: inputs.fresh-deps
        run: uv lock --upgrade
      - name: Install dependencies
        run: uv sync --frozen
      - name: Interpreter (uv-managed, pinned, has the expat allocation tracker)
        run: bash ../.github/scripts/check-interpreter.sh . --import-app
      - name: ruff check
        run: uv run --frozen ruff check .
      - name: ruff format
        run: uv run --frozen ruff format --check .
      - name: mypy
        run: uv run --frozen mypy app tools tests
      - name: pytest
        run: uv run --frozen pytest

  # Parse-time regression gate (ADR 0004 section 5). On a PR the base SHA and the head SHA are timed one
  # after the other on this runner (A/B), because shared runners differ by 10-30 % between runs, so a
  # stored number from another machine would flake. On main the head result is appended to a history
  # kept in actions/cache. Skipped for nightly (fresh-deps) so other dependency versions stay out of it.
  benchmark:
    name: benchmark
    timeout-minutes: 15
    needs: changes
    if: ${{ !cancelled() && !inputs.fresh-deps && (needs.changes.result != 'success' || needs.changes.outputs.api == 'true') }}
    runs-on: ubuntu-24.04 # pinned, not ubuntu-latest (see ci.yml header)
    permissions:
      contents: read
    env:
      BENCH_NAME: gpx-parse
      BENCH_CEILING_S: "2.0" # absolute checkpoint ceiling for the head's min
    steps:
      # Two separate checkouts, each with its own .venv from its own uv.lock: nothing of the head's
      # environment can leak into the base run. Only uv's download cache is shared (wheels, not envs).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ env.PINNED_PYTHON }}
          enable-cache: true
          cache-dependency-glob: |
            head/api/uv.lock
            base/api/uv.lock

      - name: Does the base have the benchmark test?
        id: base
        if: github.event_name == 'pull_request'
        run: |
          if [ -f base/api/tests/routes/test_benchmark.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The base commit has no benchmark test (this PR introduces it): skipping the base/head comparison. The absolute ${BENCH_CEILING_S} s check still runs."
          fi

      - name: Benchmark the base SHA
        if: steps.base.outputs.present == 'true'
        run: |
          uv sync --frozen --directory base/api
          # main's api/ has no .python-version until this fix lands, so pass the pin explicitly.
          EXPECTED_PYTHON="$PINNED_PYTHON" bash head/.github/scripts/check-interpreter.sh base/api
          bash head/.github/scripts/bench.sh run base bench/base.json

      - name: Restore benchmark history
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bench/history.json
          key: benchmark-${{ github.sha }}
          restore-keys: benchmark-

      - name: Benchmark the head SHA
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          uv sync --frozen --directory head/api
          bash head/.github/scripts/check-interpreter.sh head/api --import-app
          bash head/.github/scripts/bench.sh run head bench/head.json
          bash head/.github/scripts/bench.sh check bench/head.json "$BENCH_CEILING_S"
          if [ "${{ steps.base.outputs.present }}" = "true" ]; then
            # Filters both files to the shared names, so seed (and the action) only see those.
            bash head/.github/scripts/bench.sh names bench/base.json bench/head.json
            bash head/.github/scripts/bench.sh ratio bench/base.json bench/head.json
            # Recorded under the base SHA. The action decides "previous result" by commit id, and on a
            # pull_request event it reads the head SHA for every run, so running the action twice would
            # make both entries the same commit and silently disable the comparison. Seeding the file
            # with the base entry keeps the commits distinct.
            bash head/.github/scripts/bench.sh seed bench/base.json bench/ab.json "$BASE_SHA"
          fi

      # PR: head vs the base entry, fail above 120 % (ratio of the min times). Nothing is written back.
      - name: Compare head with base
        if: steps.base.outputs.present == 'true'
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: ${{ env.BENCH_NAME }}
          tool: customSmallerIsBetter
          output-file-path: bench/head.json
          external-data-json-path: bench/ab.json
          save-data-file: false
          alert-threshold: "120%"
          fail-threshold: "120%"
          fail-on-alert: true
          summary-always: true

      # main: append the head result to the history; the PR already gated, so never fail here.
      - name: Append to benchmark history
        if: github.event_name == 'push'
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: ${{ env.BENCH_NAME }}
          tool: customSmallerIsBetter
          output-file-path: bench/head.json
          external-data-json-path: bench/history.json
          save-data-file: true
          alert-threshold: "120%"
          fail-on-alert: false
          summary-always: true

      - name: Save benchmark history
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bench/history.json
          key: benchmark-${{ github.sha }}

  # The production image, built and run as it will be deployed (the drift guard in the Dockerfile runs inside
  # the build). Gated by the same `api` filter as api-test; skipped (counts as passing) when no api path changed.
  api-image:
    name: api-image
    timeout-minutes: 15
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.api == 'true') }}
    runs-on: ubuntu-24.04 # pinned, not ubuntu-latest (see ci.yml header)
    permissions:
      contents: read
    env:
      IMAGE: hike-api:ci
      CONTAINER: hike-api-ci
      PORT: "8081" # not 8765
      CI_VERSION: 0.0.0-ci # a sentinel, so /health proves the VERSION build arg reaches the app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: |
          docker build api --tag "$IMAGE" \
            --build-arg "GIT_SHA=$GITHUB_SHA" --build-arg "VERSION=$CI_VERSION"
      # no swap, like Cloud Run
      - name: Run container
        run: |
          docker run -d --name "$CONTAINER" --memory=512m --memory-swap=512m \
            -e "PORT=$PORT" -p "127.0.0.1:$PORT:$PORT" "$IMAGE"
      - name: /health returns the build args
        run: |
          body=""
          for _ in $(seq 1 30); do
            if body="$(curl -fsS "http://127.0.0.1:$PORT/health" 2>/dev/null)"; then break; fi
            sleep 1
          done
          echo "${body:-no response}"
          test "$(echo "$body" | jq -r .status)" = "ok"
          test "$(echo "$body" | jq -r .git_sha)" = "$GITHUB_SHA"
          test "$(echo "$body" | jq -r .version)" = "$CI_VERSION"
      - name: Container runs as uid 10001
        run: |
          uid="$(docker exec "$CONTAINER" id -u)"
          echo "uid=$uid"
          test "$uid" = "10001"
      # The bars live in the script (docs/steps/1.3a.md Checkpoint), not here; its exit code fails the job.
      # Fresh container of the image built above, tests mounted read-only (the image has no tests/).
      - name: RSS probe (hostile uploads)
        run: |
          docker rm -f "$CONTAINER"
          docker run --rm --memory=512m --memory-swap=512m -v "$PWD/api/tests:/app/tests:ro" --entrypoint python "$IMAGE" -m tests.routes.rss_probe
      # Covers the health and uid steps only; the probe runs with --rm, its server log is in its own step output.
      - name: Container logs
        if: failure()
        run: docker logs "$CONTAINER" || true
      - name: Remove container
        if: always()
        run: docker rm -f "$CONTAINER" || true

  api-contract:
    name: api-contract
    timeout-minutes: 15
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.contract == 'true') }}
    runs-on: ubuntu-24.04 # pinned, not ubuntu-latest (see ci.yml header)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ env.PINNED_PYTHON }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Resolve fresh dependencies
        if: inputs.fresh-deps
        run: |
          uv lock --upgrade --directory api
          pnpm update --recursive
      - name: Install dependencies
        run: |
          uv sync --frozen --directory api
          pnpm install --frozen-lockfile
      - name: Interpreter (uv-managed, pinned, has the expat allocation tracker)
        run: bash .github/scripts/check-interpreter.sh api --import-app
      - name: Regenerate OpenAPI schema and web types
        run: pnpm --filter web --fail-if-no-match gen:api
      - name: Fail if generated files are stale
        env:
          FRESH_DEPS: ${{ inputs.fresh-deps }}
        run: |
          # Normally any change or new file fails. A fresh-deps run also rewrites the lockfiles,
          # so there only the two generated paths count.
          if [ "$FRESH_DEPS" = "true" ]; then
            paths=(-- api/openapi.json web/src/api/schema.d.ts)
          else
            paths=()
          fi
          if [ -n "$(git status --porcelain "${paths[@]}")" ]; then
            echo "::error::Generated API files are out of date. Run 'just gen-api' and commit api/openapi.json and web/src/api/schema.d.ts."
            git status --porcelain "${paths[@]}"
            exit 1
          fi

  web-test:
    name: web-test
    timeout-minutes: 15
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-24.04 # pinned, not ubuntu-latest (see ci.yml header)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Resolve fresh dependencies
        if: inputs.fresh-deps
        run: pnpm update --recursive
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm --filter web --fail-if-no-match lint
      - name: Type check
        run: pnpm --filter web --fail-if-no-match exec tsc -b --noEmit
      - name: Vitest with coverage
        run: pnpm --filter web --fail-if-no-match test:coverage
      - name: Build
        run: pnpm --filter web --fail-if-no-match build
      - name: size-limit
        run: pnpm --filter web --fail-if-no-match size

  e2e:
    name: e2e
    timeout-minutes: 30
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-24.04 # pinned, not ubuntu-latest (see ci.yml header)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ env.PINNED_PYTHON }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Resolve fresh dependencies
        if: inputs.fresh-deps
        run: |
          uv lock --upgrade --directory api
          pnpm update --recursive
      - name: Install dependencies
        run: |
          uv sync --frozen --directory api
          pnpm install --frozen-lockfile
      - name: Interpreter (uv-managed, pinned, has the expat allocation tracker)
        run: bash .github/scripts/check-interpreter.sh api --import-app
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm --filter web --fail-if-no-match exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers and system deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web --fail-if-no-match exec playwright install --with-deps chromium webkit
      - name: Install Playwright system deps (browsers cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter web --fail-if-no-match exec playwright install-deps chromium webkit
      - name: Playwright (all projects)
        run: pnpm --filter web --fail-if-no-match exec playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
