name: Deploy API

# ADR 0002 section 4: build once, deploy with no traffic, smoke the candidate,
# promote, smoke the live service, and roll back automatically if the live check fails.
# Every decision (versions, revisions, URLs, smoke) lives in api/tools/deploy.py.

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-api
    runs-on: ubuntu-24.04 # pinned, not ubuntu-latest (see ci.yml header)
    timeout-minutes: 20
    # The environment admits only main and gives the OIDC subject
    # repo:<owner>/<repo>:environment:production that api-deploy trusts.
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      RUNTIME_SA: ${{ vars.API_RUNTIME_SA }}
      SERVICE: hike-api
      UV_PYTHON_PREFERENCE: only-managed # never the runner's system python (ADR 0004 section 3.11)
      PINNED_PYTHON: "3.12.15" # must equal api/.python-version; the Interpreter step fails if it drifts
      # Single source for the Cloud Run per-instance concurrency: the deploy flag and the check below
      # both read it (ADR 0004 section 3.10, manager decision 2026-10-20).
      EXPECTED_CONCURRENCY: "8"
      DEPLOY_TOOL: uv run --frozen --directory api python -m tools.deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ env.PINNED_PYTHON }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Interpreter (uv-managed, pinned)
        run: |
          uv sync --frozen --directory api
          bash .github/scripts/check-interpreter.sh api --import-app

      - name: Authenticate to Google Cloud (WIF, no keys)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.API_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # auth@v3 only writes a credentials file; this forces the real STS +
      # impersonation exchange so a failure shows gcloud's own error. Never prints the token.
      - name: Verify Google credentials
        shell: bash
        run: |
          echo "Expected OIDC subject: repo:${{ github.repository_owner }}@${{ github.repository_owner_id }}/${{ github.event.repository.name }}@${{ github.repository_id }}:environment:production"
          if ! gcloud auth print-access-token --quiet > /dev/null; then
            echo "::error::Google credential exchange failed: check WIF provider condition, the workloadIdentityUser binding for this job's subject, and runbook steps 7–8"
            exit 1
          fi

      - name: Read API version
        id: version
        run: |
          VERSION=$($DEPLOY_TOOL version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Record the serving revision
        id: before
        run: |
          if ! gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" \
            --format=json > "$RUNNER_TEMP/before.json"; then
            echo "::error::could not read the Cloud Run service $SERVICE (it does not exist yet, or the deploy account lacks permission to read it): see runbook step 9"
            exit 1
          fi
          $DEPLOY_TOOL serving --service-json "$RUNNER_TEMP/before.json" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/hike/api:$GITHUB_SHA"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build api --tag "$IMAGE" \
            --build-arg "GIT_SHA=$GITHUB_SHA" --build-arg "VERSION=$VERSION"
          docker push "$IMAGE"

      - name: Deploy candidate (no traffic)
        run: |
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --service-account="$RUNTIME_SA" \
            --no-traffic --tag=candidate \
            --min-instances=0 --max-instances=1 \
            --memory=512Mi --cpu=1 --concurrency="$EXPECTED_CONCURRENCY" --cpu-boost \
            --no-invoker-iam-check \
            --set-env-vars="HIKE_ENV=production,HIKE_LOG_LEVEL=INFO,HIKE_CORS_ORIGINS=[],HIKE_CORS_FIREBASE_SITE=$PROJECT_ID" \
            --quiet

      - name: Locate the candidate
        id: after
        run: |
          gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" \
            --format=json > "$RUNNER_TEMP/after.json"
          $DEPLOY_TOOL tagged --service-json "$RUNNER_TEMP/after.json" --tag candidate >> "$GITHUB_OUTPUT"

      - name: Verify candidate concurrency
        env:
          CANDIDATE_REVISION: ${{ steps.after.outputs.candidate_revision }}
        run: |
          gcloud run revisions describe "$CANDIDATE_REVISION" --region="$REGION" --project="$PROJECT_ID" \
            --format=json > "$RUNNER_TEMP/candidate-revision.json"
          $DEPLOY_TOOL concurrency --revision-json "$RUNNER_TEMP/candidate-revision.json" \
            --expected "$EXPECTED_CONCURRENCY"

      - name: Smoke the candidate
        env:
          CANDIDATE_URL: ${{ steps.after.outputs.candidate_url }}
        run: |
          $DEPLOY_TOOL smoke --url "$CANDIDATE_URL" --expected-sha "$GITHUB_SHA" \
            --origin "https://$PROJECT_ID.web.app"

      - name: Promote the candidate to 100% traffic
        id: promote
        env:
          CANDIDATE_REVISION: ${{ steps.after.outputs.candidate_revision }}
        run: |
          gcloud run services update-traffic "$SERVICE" --region="$REGION" --project="$PROJECT_ID" \
            --to-revisions="$CANDIDATE_REVISION=100" --quiet

      - name: Smoke the live service
        id: live
        run: |
          LIVE_URL=$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" \
            --format='value(status.url)')
          $DEPLOY_TOOL smoke --url "$LIVE_URL" --expected-sha "$GITHUB_SHA" \
            --origin "https://$PROJECT_ID.web.app"

      - name: Roll back to the previous revision
        if: always() && steps.promote.outcome == 'success' && steps.live.outcome != 'success'
        env:
          PREVIOUS_REVISION: ${{ steps.before.outputs.previous_revision }}
        run: |
          gcloud run services update-traffic "$SERVICE" --region="$REGION" --project="$PROJECT_ID" \
            --to-revisions="$PREVIOUS_REVISION=100" --quiet

      - name: Traffic table and summary
        if: always()
        env:
          CANDIDATE_REVISION: ${{ steps.after.outputs.candidate_revision }}
          CANDIDATE_URL: ${{ steps.after.outputs.candidate_url }}
          PREVIOUS_REVISION: ${{ steps.before.outputs.previous_revision }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Deploy API"
            echo
            echo "- Result: $JOB_STATUS"
            echo "- Commit: $GITHUB_SHA"
            echo "- Previous revision: ${PREVIOUS_REVISION:-n/a}"
            echo "- Candidate revision: ${CANDIDATE_REVISION:-n/a}"
            echo "- Candidate URL: ${CANDIDATE_URL:-n/a}"
            echo
            echo "### Traffic (status.traffic)"
            echo '```'
            gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" \
              --format='yaml(status.traffic)' \
              || echo "(could not read the service)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
