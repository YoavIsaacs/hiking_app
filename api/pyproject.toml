[project]
name = "hike-prep-api"
version = "0.1.0"
description = "Hike Prep App API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]
