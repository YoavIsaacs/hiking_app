name: Deploy Web

# ADR 0002 sections 3 and 11: build the PWA with the committed production
# VITE_API_URL (web/.env.production), deploy to Firebase Hosting through WIF
# (web-deploy service account, no keys), then run the Playwright smoke against
# the live URL. A web failure never rolls back the API (ADR 0002 section 10).

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "firebase.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The environment admits only main and gives the OIDC subject
    # repo:<owner>/<repo>:environment:production that web-deploy trusts.
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      # CI-only tool, pinned exactly (ADR 0002 section 3).
      FIREBASE_TOOLS_VERSION: "15.34.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (production VITE_API_URL from web/.env.production)
        run: pnpm --filter web --fail-if-no-match build

      - name: Authenticate to Google Cloud (WIF, no keys)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.WEB_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # auth@v3 only writes a credentials file; this forces the real STS +
      # impersonation exchange so a failure shows gcloud's own error. Never prints the token.
      - name: Verify Google credentials
        shell: bash
        run: |
          echo "Expected OIDC subject: repo:${{ github.repository_owner }}@${{ github.repository_owner_id }}/${{ github.event.repository.name }}@${{ github.repository_id }}:environment:production"
          if ! gcloud auth print-access-token --quiet > /dev/null; then
            echo "::error::Google credential exchange failed: check WIF provider condition, the workloadIdentityUser binding for this job's subject, and runbook steps 7–8"
            exit 1
          fi

      - name: Deploy to Firebase Hosting
        run: |
          npx --yes "firebase-tools@$FIREBASE_TOOLS_VERSION" deploy \
            --only hosting --project "$PROJECT_ID" --non-interactive

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm --filter web --fail-if-no-match exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers and system deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web --fail-if-no-match exec playwright install --with-deps chromium webkit

      - name: Install Playwright system deps (browsers cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter web --fail-if-no-match exec playwright install-deps chromium webkit

      # Live mode of web/playwright.config.ts: no local servers, all three projects.
      - name: Playwright smoke against the live site
        run: |
          E2E_API_URL=$(grep '^VITE_API_URL=' web/.env.production | cut -d= -f2-)
          export E2E_API_URL
          export E2E_BASE_URL="https://$PROJECT_ID.web.app"
          pnpm --filter web --fail-if-no-match exec playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-live
          path: web/playwright-report/
          retention-days: 7
