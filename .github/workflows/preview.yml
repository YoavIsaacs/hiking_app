name: Preview

# ADR 0002 section 3: one Firebase Hosting preview channel per PR, URL commented
# on the PR. Trigger is `pull_request` only, never `pull_request_target`.
# Fork and Dependabot PRs cannot get an OIDC token, so they are skipped.
# The deploy job holds id-token only; the comment job holds pull-requests: write
# only and never checks out or runs PR code.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: preview-deploy
    # A skip, not a security control (ADR 0002 section 1).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      CHANNEL: pr-${{ github.event.pull_request.number }}
      FIREBASE_TOOLS_VERSION: "15.34.0"
    outputs:
      url: ${{ steps.channel.outputs.url }}
      expires: ${{ steps.channel.outputs.expires }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same production build as deploy-web: previews talk to the production API.
      - name: Build
        run: pnpm --filter web --fail-if-no-match build

      - name: Authenticate to Google Cloud (WIF, no keys)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.WEB_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # auth@v3 only writes a credentials file; this forces the real STS +
      # impersonation exchange so a failure shows gcloud's own error. Never prints the token.
      - name: Verify Google credentials
        shell: bash
        run: |
          echo "Expected OIDC subject: repo:${{ github.repository_owner }}@${{ github.repository_owner_id }}/${{ github.event.repository.name }}@${{ github.repository_id }}:pull_request"
          if ! gcloud auth print-access-token --quiet > /dev/null; then
            echo "::error::Google credential exchange failed: check WIF provider condition, the workloadIdentityUser binding for this job's subject, and runbook steps 7–8"
            exit 1
          fi

      - name: Deploy preview channel
        id: channel
        shell: bash # explicit bash gives -eo pipefail
        run: |
          # stdout (the JSON, which carries the error on failure) goes to a file;
          # stderr stays in the log. Print the file before failing so errors show.
          # No --debug: debug output can include tokens.
          if ! npx --yes "firebase-tools@$FIREBASE_TOOLS_VERSION" hosting:channel:deploy "$CHANNEL" \
            --expires 7d --no-authorized-domains --project "$PROJECT_ID" --json > "$RUNNER_TEMP/channel.json"; then
            cat "$RUNNER_TEMP/channel.json"
            echo "::error::firebase hosting:channel:deploy failed (output above)"
            exit 1
          fi
          cat "$RUNNER_TEMP/channel.json"
          URL=$(jq -er '[.result[]][0].url' "$RUNNER_TEMP/channel.json")
          EXPIRES=$(jq -er '[.result[]][0].expireTime' "$RUNNER_TEMP/channel.json")
          case "$URL" in
            "https://$PROJECT_ID--"*) ;;
            *)
              echo "::error::Unexpected preview URL: $URL"
              exit 1
              ;;
          esac
          {
            echo "url=$URL"
            echo "expires=$EXPIRES"
          } >> "$GITHUB_OUTPUT"

  comment:
    name: preview-comment
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PREVIEW_URL: ${{ needs.deploy.outputs.url }}
      PREVIEW_EXPIRES: ${{ needs.deploy.outputs.expires }}
    steps:
      - name: Comment the preview URL on the PR
        run: |
          {
            echo "Preview deployed: $PREVIEW_URL"
            echo
            echo "Expires: $PREVIEW_EXPIRES (a new push resets the timer)."
            echo "It talks to the production API."
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --edit-last --create-if-none --body-file "$RUNNER_TEMP/comment.md"
