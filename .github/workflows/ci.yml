name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          uv sync --frozen --directory api
          pnpm install --frozen-lockfile
      - name: pre-commit
        run: uvx pre-commit@4.7.0 run --all-files --show-diff-on-failure

  api-test:
    name: api-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: ruff check
        run: uv run --frozen ruff check .
      - name: ruff format
        run: uv run --frozen ruff format --check .
      - name: mypy
        run: uv run --frozen mypy app tests
      - name: pytest
        run: uv run --frozen pytest

  api-contract:
    name: api-contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: |
          uv sync --frozen --directory api
          pnpm install --frozen-lockfile
      - name: Regenerate OpenAPI schema and web types
        run: pnpm --filter web --fail-if-no-match gen:api
      - name: Fail if generated files are stale
        run: |
          if ! git diff --exit-code || [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated API files are out of date. Run 'just gen-api' and commit api/openapi.json and web/src/api/schema.d.ts."
            git status --porcelain
            exit 1
          fi

  web-test:
    name: web-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm --filter web lint
      - name: Type check
        run: pnpm --filter web exec tsc -b --noEmit
      - name: Vitest with coverage
        run: pnpm --filter web test:coverage
      - name: Build
        run: pnpm --filter web build
      - name: size-limit
        run: pnpm --filter web size

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: |
          uv sync --frozen --directory api
          pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers and system deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium webkit
      - name: Install Playwright system deps (browsers cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter web exec playwright install-deps chromium webkit
      - name: Playwright (all projects)
        run: pnpm --filter web exec playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
