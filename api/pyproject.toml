[project]
name = "hike-prep-api"
version = "0.2.0"
description = "Hike Prep App API"
# First 3.12 with expat SetAllocTrackerActivationThreshold etc.; see docs/adr/0004 §3.11.
requires-python = ">=3.12.13,<3.13"
dependencies = [
    "anyio>=4.15.1",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No build-system, so the project is not installed; put api/ on sys.path so `import app` works.
pythonpath = ["."]
# --allow-hosts=127.0.0.1: Starlette's TestClient needs a loopback socketpair on Windows;
# outbound network stays blocked.
addopts = "--cov=app --cov=tools --cov-fail-under=85 --disable-socket --allow-hosts=127.0.0.1 --benchmark-disable"
filterwarnings = [
    "error",
    # Starlette deprecates httpx for TestClient in favour of httpx2, which would be an unapproved new dependency.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tools"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[dependency-groups]
dev = [
    "hypothesis>=6.170.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]
